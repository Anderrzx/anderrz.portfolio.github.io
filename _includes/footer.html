<footer class="site-footer">
    <div class="container footer-inner">
        <div>
            <a class="wordmark" href="{{ '/' | relative_url }}">ANDERRZ</a>
            <p class="footer-tagline">Web design, digital marketing &amp; visual storytelling.</p>
        </div>

        <nav aria-label="Footer">
            <ul class="footer-links">
                {% for item in site.data.navigation %}
                <li><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
                {% endfor %}
                <li><a href="{{ '/web-design/' | relative_url }}">Website Redesigns</a></li>
            </ul>
        </nav>

        <!-- Social links come from _data/social.yml -->
        <ul class="footer-links" aria-label="Social">
            {% for profile in site.data.social %}
            <li><a href="{{ profile.url }}" rel="noopener">{{ profile.name }}</a></li>
            {% endfor %}
        </ul>
    </div>
    <div class="container footer-bottom">
        <p>&copy; {{ 'now' | date: '%Y' }} Anderrz</p>
    </div>
</footer>
