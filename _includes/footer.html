<footer class="site-footer">
    <div class="container footer-inner">
        <div>
            <a class="wordmark" href="{{ '/' | relative_url }}">ANDERRZ</a>
            <p class="footer-tagline">Web design, digital marketing &amp; visual storytelling.</p>
        </div>

        <nav aria-label="Footer">
            <ul class="footer-links">
                {% for item in site.data.navigation %}
                <li><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
                {% endfor %}
                <li><a href="{{ '/web-design/' | relative_url }}">Website Redesigns</a></li>
            </ul>
        </nav>

        <!-- Social links. Add yours here, e.g.
             <ul class="footer-links">
                 <li><a href="https://instagram.com/yourname" rel="noopener">Instagram</a></li>
                 <li><a href="https://vimeo.com/yourname" rel="noopener">Vimeo</a></li>
             </ul> -->
    </div>
    <div class="container footer-bottom">
        <p>&copy; {{ 'now' | date: '%Y' }} Anderrz</p>
    </div>
</footer>
