{% comment %}
  Thin line icon for a social profile. Use it like:
  {% include social-icon.html icon="instagram" %}
{% endcomment %}
<svg class="social-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{% case include.icon %}
{% when "instagram" %}
    <rect x="3" y="3" width="18" height="18" rx="5"/>
    <circle cx="12" cy="12" r="4"/>
    <circle cx="17.3" cy="6.7" r="0.6" fill="currentColor"/>
{% when "tiktok" %}
    <path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/>
    <path d="M14 3c.4 2.6 2.4 4.6 5 5"/>
{% when "youtube" %}
    <rect x="2.5" y="5.5" width="19" height="13" rx="4"/>
    <path d="M10.2 9.3v5.4l4.6-2.7z" fill="currentColor"/>
{% endcase %}
</svg>
