<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121110">

    <!-- Lets the CSS know JavaScript is on, so scroll animations only hide content when they can reveal it -->
    <script>document.documentElement.classList.add('js');</script>
    <!-- Arriving from another page: start out of focus so the focus pull can bring it in (see main.js) -->
    <script>
        try {
            if (sessionStorage.getItem('anderrz-focus') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.documentElement.classList.add('focus-in');
            }
        } catch (error) { /* storage blocked: no transition */ }
    </script>

    <link rel="preload" href="{{ '/assets/fonts/satoshi.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <!-- ?v= changes on every publish, so browsers pick up new styles and scripts right away -->
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">

    <!-- Title, description and social share tags (jekyll-seo-tag) -->
    {% seo %}
</head>
<body class="{{ page.body_class }}">
    <a class="skip-link" href="#main">Skip to content</a>

    {% include header.html %}

    <main id="main">
        {{ content }}
    </main>

    {% include footer.html %}

    <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
